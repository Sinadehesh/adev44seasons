name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      # The compiled app lands in src-tauri/target/release:
      #   - adev44seasons.exe            (standalone executable)
      #   - bundle/msi/*.msi             (MSI installer)
      #   - bundle/nsis/*-setup.exe      (NSIS installer)
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: adev44seasons-windows
          path: |
            src-tauri/target/release/adev44seasons.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
