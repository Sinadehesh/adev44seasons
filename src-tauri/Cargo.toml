[package]
name = "adev44seasons"
version = "0.1.0"
description = "A lightweight background productivity companion."
edition = "2021"
rust-version = "1.77.2"

# The Tauri desktop app is built as a library that both the binary and the
# mobile entry points link against (Tauri v2 convention).
[lib]
name = "adev44seasons_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables tauri::tray (system tray icon + menu) for Phase 7.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cross-platform global (OS-level) input listener. Captures key events even
# when the app window is not focused.
rdev = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
